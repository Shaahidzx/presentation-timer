<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Presentation Timer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&family=JetBrains+Mono:wght@700&display=swap">
<style>
/* Viewers: just the clock, full window. Admin (open with #admin): same clock plus controls, timings and log below. */
:root {
  --bg: #ffffff; --fg: #10261a; --green: #0b8a3e; --blue: #0a64c2; --dim: #4b6656; --line: #cfe3d6; --warn: #b45309; --flash: #d6f5e1;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace; --sans: "Inter", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); padding: 0 max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left)); }
[hidden] { display: none !important; }
#stage { --c: var(--green); min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.5vh; text-align: center; }
body.q #stage { --c: var(--blue); }
#name { font: 600 clamp(22px, 5vw, 64px)/1.1 var(--sans); min-height: 1.1em; text-wrap: balance; }
#phase { font: 600 clamp(16px, 3vw, 40px)/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--c); }
#clock { font: 700 clamp(80px, 30vw, 58vh)/0.95 var(--mono); color: var(--c); font-variant-numeric: tabular-nums; letter-spacing: -.03em; white-space: nowrap; user-select: none; }
#clock.over { color: var(--warn); }
#sub { font: 500 clamp(14px, 1.8vw, 24px)/1.3 var(--sans); color: var(--dim); min-height: 1.3em; }
body.flash #stage { animation: flash .5s ease-in-out 6; }
@keyframes flash { 50% { background: var(--flash); } }
@media (prefers-reduced-motion: reduce) { body.flash #stage { animation: none; outline: 6px solid var(--warn); } }

button { font: 600 15px var(--sans); color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; cursor: pointer; }
button:hover { border-color: var(--green); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
button.primary { background: var(--green); color: #fff; border-color: var(--green); }
body.q button.primary { background: var(--blue); border-color: var(--blue); }
button.danger { border-color: var(--warn); color: var(--warn); }
#panel, #login { max-width: 900px; margin: 0 auto; padding: 24px 0 48px; display: grid; gap: 28px; border-top: 1px solid var(--line); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
label { color: var(--dim); font-size: 14px; }
input { font: 600 16px var(--sans); background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 9px 10px; }
input[type=number] { width: 4.5em; font-family: var(--mono); }
#nameIn { width: min(320px, 100%); }
h2 { font: 600 13px var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--dim); margin: 0 0 10px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font: 14px/1.5 var(--sans); }
th, td { text-align: left; padding: 8px 12px 8px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { color: var(--dim); font-weight: 600; }
td.n { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.over { color: var(--warn); }
#log { list-style: none; margin: 0; padding: 0; font: 14px/1.7 var(--mono); max-height: 40vh; overflow: auto; }
#log time { color: var(--dim); margin-right: 12px; }
.note { color: var(--dim); font-size: 13px; margin: 0; }
:fullscreen #panel { display: none; }
</style>
</head>
<body>

<main id="stage" title="Double-click for full screen">
  <div id="name"></div>
  <div id="phase">Ready</div>
  <div id="clock">5:00</div>
  <div id="sub">Waiting for the host</div>
  <div id="tapHint" class="note" hidden>Tap anywhere to turn on the 1-minute chime</div>
</main>

<form id="login" hidden>
  <div class="row">
    <label for="pin">Admin PIN</label><input id="pin" type="password" inputmode="numeric" autocomplete="current-password">
    <button class="primary" type="submit">Log in</button>
    <span class="note" id="loginMsg"></span>
  </div>
</form>

<section id="panel" hidden>
  <div class="row">
    <button id="sound" type="button">🔔 Enable chime</button>
    <button id="fs" type="button">Full screen</button>
    <span class="note" id="status">Ready</span>
  </div>
  <div>
    <div class="row" style="margin-bottom:14px">
      <label for="nameIn">Presenter</label><input id="nameIn" type="text" placeholder="Presenter name" maxlength="80">
      <label for="presMin">Presentation (min)</label><input id="presMin" type="number" min="1" max="120" value="5">
      <label for="qMin">Questions (min)</label><input id="qMin" type="number" min="0" max="120" value="7">
    </div>
    <div class="row">
      <button id="bMain" class="primary" type="button">Start presentation</button>
      <button id="bPause" type="button">Pause</button>
      <button id="bPlus" type="button">+1 min</button>
      <button id="bMinus" type="button">−1 min</button>
      <button id="bReset" type="button">Reset this presenter</button>
    </div>
  </div>
  <div>
    <h2>Timings <span class="row"><button id="bCopy" type="button">Copy table</button><button id="bClear" type="button">Clear results</button></span></h2>
    <div class="scroll"><table>
      <thead><tr><th>Presenter</th><th>Presentation</th><th>Time added</th><th>Questions</th></tr></thead>
      <tbody id="results"></tbody>
    </table></div>
    <p class="note" id="noResults">Each presenter's times appear here once their presentation ends.</p>
  </div>
  <div>
    <h2>Log <button id="bLogout" type="button">Log out</button></h2>
    <ul id="log"></ul>
  </div>
</section>

<script>
// ponytail: no database. Admin POSTs the clock state to a public ntfy.sh topic; viewers listen with EventSource.
// Ceiling: anyone who reads this file could post to the topic too. If pranks become a problem, move to Firebase with real auth.
const TOPIC = "ptimer-77ff92fe20ec130f";
const RELAY = "https://ntfy.sh/" + TOPIC;
const PIN_HASH = "cc5e3db9d85dbd2be36bf187bc5a1e48905d4ad9620b8fb5250ec09d0e6b0d22"; // sha256 of the admin PIN
const $ = id => document.getElementById(id);
const store = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
                set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

// total = time allowed for the current phase including ±1 min adjustments; used = total − time left.
const DEFAULT = { phase: "idle", running: false, endsAt: 0, remaining: 5 * 60000, total: 5 * 60000, qStarted: false,
  name: "", presMs: 5 * 60000, qMs: 7 * 60000, log: [], results: [] };
let S = { ...DEFAULT }, isAdmin = false, chimed = false, audio = null;

const fmt = ms => {
  const neg = ms < 0, s = Math.ceil(Math.abs(ms) / 1000);
  return (neg ? "+" : "") + Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
};
const dur = ms => fmt(Math.abs(ms)).replace("+", "");
// ponytail: every screen counts down to the same endsAt with its own clock; phones and laptops sync to network time, so skew is ~1s at worst.
const left = () => S.running ? S.endsAt - Date.now() : S.remaining;

function render() {
  const ms = left(), waitingQ = S.phase === "q" && !S.qStarted;
  document.body.classList.toggle("q", S.phase === "q");
  $("name").textContent = S.name && S.phase !== "idle" ? "Presenting: " + S.name : "";
  $("phase").textContent = { idle: "Ready", pres: "Presentation", q: "Questions", done: "Finished" }[S.phase]
    + ((S.phase === "pres" || (S.phase === "q" && S.qStarted)) && !S.running ? " · paused" : "");
  $("clock").textContent = S.phase === "done" ? "0:00" : fmt(ms);
  $("clock").classList.toggle("over", ms < 0 && S.phase !== "done");
  $("sub").textContent =
    S.phase === "idle" ? "Waiting for the host" :
    waitingQ ? "Questions start soon" :
    S.phase === "pres" && ms < 0 ? "Presentation time is up" :
    S.phase === "pres" && ms <= 60000 ? "Last minute" :
    S.phase === "q" && ms < 0 ? "Question time is up" : "";
  if (S.phase === "pres" && S.running && ms <= 60000 && ms > 55000 && !chimed) { chimed = true; chime(); }
  if (S.phase !== "pres" || ms > 60000) chimed = false;
  if (!isAdmin) return;
  $("bMain").textContent = { idle: "Start presentation", pres: "End presentation → Questions",
    q: waitingQ ? "Start questions" : "End questions", done: "Next presenter" }[S.phase];
  const active = S.phase === "pres" || (S.phase === "q" && S.qStarted);
  $("bPause").hidden = !active;
  $("bPlus").hidden = $("bMinus").hidden = !(active || waitingQ);
  $("bPause").textContent = S.running ? "Pause" : "Resume";
}
setInterval(render, 200);

function renderPanel() {
  const ul = $("log"); ul.textContent = "";
  for (const e of S.log) {
    const li = document.createElement("li"), t = document.createElement("time");
    t.textContent = new Date(e.t).toLocaleTimeString();
    li.append(t, document.createTextNode(e.msg));
    ul.append(li);
  }
  const tb = $("results"); tb.textContent = "";
  for (const r of S.results) {
    const tr = document.createElement("tr");
    const cell = (text, over) => { const td = document.createElement("td"); td.className = "n"; td.textContent = text; if (over) td.classList.add("over"); tr.append(td); };
    const nameTd = document.createElement("td"); nameTd.textContent = r.name || "Unnamed"; tr.append(nameTd);
    cell(dur(r.presUsed) + " / " + dur(r.presAllowed), r.presUsed > r.presAllowed);
    cell(dur(r.added));
    cell(r.qUsed == null ? "in progress" : dur(r.qUsed) + " / " + dur(r.qAllowed), r.qUsed > r.qAllowed);
    tb.append(tr);
  }
  $("noResults").hidden = S.results.length > 0;
  $("presMin").value = S.presMs / 60000; $("qMin").value = S.qMs / 60000;
  if (S.phase !== "idle") $("nameIn").value = S.name;
}

// Three bell strikes + screen flash. Plays on the admin's device.
function chime() {
  document.body.classList.remove("flash"); void document.body.offsetWidth; document.body.classList.add("flash");
  if (!audio) return;
  for (let i = 0; i < 3; i++) {
    const t0 = audio.currentTime + i * 0.9;
    for (const f of [880, 1320]) {
      const o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = f; o.connect(g); g.connect(audio.destination);
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.4, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.8);
      o.start(t0); o.stop(t0 + 0.85);
    }
  }
}
const toggleFs = () => { const p = document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.(); p?.catch?.(() => {}); };
$("stage").ondblclick = toggleFs;
$("fs").onclick = toggleFs;
// Browsers only allow sound after a tap/click/key on the page.
function unlockAudio() {
  if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
  audio.resume(); $("tapHint").hidden = true;
}
$("sound").onclick = () => { unlockAudio(); $("sound").textContent = "🔔 Chime on"; chime(); };

// ---------- viewer: listen to the relay ----------
function listen() {
  // since=12h replays recent messages so a late joiner lands on the latest state (last one wins).
  const es = new EventSource(RELAY + "/sse?since=12h");
  es.onmessage = e => {
    try {
      const m = JSON.parse(e.data);
      if (m.event !== "message") return;
      const pub = JSON.parse(m.message);
      if (pub.v === 1 && (!S.sentAt || pub.sentAt >= S.sentAt)) { S = { ...S, ...pub }; render(); }
    } catch {}
  };
}

// ---------- admin ----------
async function sha256(text) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
}
async function save(next, msg) {
  next.log = [{ t: Date.now(), msg }, ...S.log].slice(0, 100);
  S = next; store.set("timer-admin", S); renderPanel(); render();
  // Viewers only get what they need to draw the clock; timings and log stay on the admin's device.
  const pub = { v: 1, sentAt: Date.now(), phase: S.phase, running: S.running, endsAt: S.endsAt, remaining: S.remaining, qStarted: S.qStarted, name: S.name };
  try {
    const r = await fetch(RELAY, { method: "POST", body: JSON.stringify(pub) });
    $("status").textContent = r.ok ? "Sent to viewers · " + new Date().toLocaleTimeString() : "Relay refused the update (" + r.status + "). Try again in a few seconds.";
  } catch { $("status").textContent = "Couldn't reach the relay. Check the internet connection and press the button again."; }
}
const mins = id => Math.max(0, Number($(id).value) || 0) * 60000;
const who = () => S.name || "Presenter";

$("bMain").onclick = () => {
  const now = Date.now();
  if (S.phase === "idle") {
    const presMs = mins("presMin"), qMs = mins("qMin"), name = $("nameIn").value.trim();
    save({ ...S, phase: "pres", running: true, endsAt: now + presMs, remaining: presMs, total: presMs, qStarted: false, name, presMs, qMs },
      `${name || "Presenter"} started presenting (${dur(presMs)})`);
  } else if (S.phase === "pres") {
    const l = left(), leftover = Math.max(0, l), q = S.qMs + leftover, used = S.total - l;
    const row = { name: S.name, presUsed: used, presAllowed: S.total, added: leftover, qUsed: null, qAllowed: q };
    save({ ...S, phase: "q", running: false, remaining: q, total: q, qStarted: false, results: [...S.results, row] },
      `${who()} presented for ${dur(used)} · ${dur(leftover)} added → Questions ${dur(q)} (waiting to start)`);
  } else if (S.phase === "q" && !S.qStarted) {
    save({ ...S, running: true, qStarted: true, endsAt: now + S.remaining }, `Questions started (${fmt(S.remaining)})`);
  } else if (S.phase === "q") {
    const l = left(), used = S.total - l, results = S.results.slice(), last = results[results.length - 1];
    if (last && last.qUsed == null) results[results.length - 1] = { ...last, qUsed: used, qAllowed: S.total };
    save({ ...S, phase: "done", running: false, remaining: 0, results }, `${who()} questions ended after ${dur(used)}`);
  } else {
    $("nameIn").value = "";
    save({ ...S, phase: "idle", running: false, name: "", remaining: S.presMs, total: S.presMs, qStarted: false }, "Ready for next presenter");
  }
};
$("bPause").onclick = () => {
  const ms = left();
  save(S.running ? { ...S, running: false, remaining: ms } : { ...S, running: true, endsAt: Date.now() + S.remaining },
    (S.running ? "Paused at " : "Resumed at ") + fmt(ms));
};
const adjust = d => {
  const base = { ...S, total: S.total + d };
  save(S.running ? { ...base, endsAt: S.endsAt + d } : { ...base, remaining: S.remaining + d }, (d > 0 ? "+1 min" : "−1 min") + " → " + fmt(left() + d));
};
$("bPlus").onclick = () => adjust(60000);
$("bMinus").onclick = () => adjust(-60000);
$("bReset").onclick = () => {
  const p = mins("presMin");
  save({ ...S, phase: "idle", running: false, remaining: p, total: p, qStarted: false, presMs: p, qMs: mins("qMin") }, "Reset " + who());
};
let clearArmed = 0;
$("bClear").onclick = () => {
  if (Date.now() - clearArmed > 4000) {
    clearArmed = Date.now(); $("bClear").textContent = "Click again to clear"; $("bClear").classList.add("danger");
    setTimeout(() => { $("bClear").textContent = "Clear results"; $("bClear").classList.remove("danger"); }, 4000); return;
  }
  clearArmed = 0; save({ ...S, results: [] }, "Results cleared");
};
$("bCopy").onclick = () => {
  const text = [["Presenter", "Presentation used", "Presentation allowed", "Time added", "Questions used", "Questions allowed"],
    ...S.results.map(r => [r.name || "Unnamed", dur(r.presUsed), dur(r.presAllowed), dur(r.added), r.qUsed == null ? "" : dur(r.qUsed), dur(r.qAllowed)])]
    .map(row => row.join("\t")).join("\n");
  navigator.clipboard.writeText(text).then(() => { $("bCopy").textContent = "Copied"; setTimeout(() => $("bCopy").textContent = "Copy table", 1500); },
    () => { $("status").textContent = "Copy was blocked. Select the table and copy it instead."; });
};
$("bLogout").onclick = () => { try { sessionStorage.removeItem("timer-admin-ok"); } catch {} location.hash = ""; location.reload(); };

function enterAdmin() {
  isAdmin = true;
  S = { ...DEFAULT, ...(store.get("timer-admin") || {}) };
  $("login").hidden = true; $("panel").hidden = false;
  renderPanel(); render();
}
$("login").onsubmit = async e => {
  e.preventDefault();
  if (await sha256($("pin").value.trim()) === PIN_HASH) {
    try { sessionStorage.setItem("timer-admin-ok", "1"); } catch {}
    enterAdmin();
  } else { $("loginMsg").textContent = "Wrong PIN. Try again."; $("pin").select(); }
};

// Open the page with #admin to log in. Everyone else is a viewer.
if (location.hash === "#admin") {
  let ok = false; try { ok = sessionStorage.getItem("timer-admin-ok") === "1"; } catch {}
  if (ok) enterAdmin(); else { $("login").hidden = false; $("pin").focus(); }
} else {
  listen();
  $("tapHint").hidden = false;
  for (const ev of ["pointerdown", "keydown"]) document.addEventListener(ev, unlockAudio, { once: true });
}
render();
</script>
</body>
</html>
